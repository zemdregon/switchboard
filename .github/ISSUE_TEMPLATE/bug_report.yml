name: Bug report
description: Something in Switchboard does not work as documented
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste API keys, OAuth tokens, `auth.json` contents, session cookies or provider login
        details into an issue. Redact secrets from your config before attaching it. Report security
        problems privately through the contact link in the issue chooser, not in a public issue.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit SHA you built from (`git rev-parse --short HEAD` in your checkout).
      placeholder: e.g. 545628a
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config (redacted)
      description: Your config file with any secrets, paths outside the report and tokens removed.
      render: json
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands you ran and what you ran them against (fake adapter or provider CLI with version).
      placeholder: |
        1. `node dist/cli/bin.js doctor --config ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What the documentation says should happen, with a link to the section if you can.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead, including exit codes and the exact error text.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "doctor output"
      description: The full text output of `switchboard doctor` for the config above (redacted as needed).
      render: shell

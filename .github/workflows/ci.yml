name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Typecheck, lint, test, docs check (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by version tag; SHA pinning is pending (see TDD section 2, CI row).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ADR-0059: the Cursor bypass-cell wrapper tests run the real bwrap where it can start a sandbox, else skip.
      - name: Install bubblewrap
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # T8.11 (NFR-MAINT-06): coverage of the same suite, no threshold; the report is an artifact for review.
      - name: Coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

      - name: Build
        run: npm run build

      - name: Pack smoke test
        run: npm run pack:smoke

      - name: Check documentation consistency
        run: node scripts/check-docs.mjs

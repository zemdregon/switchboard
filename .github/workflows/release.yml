# Release plumbing. Pushing a tag `vX.Y.Z` (after bumping `package.json` and
# moving the `Unreleased` CHANGELOG section) drafts a GitHub release carrying
# the `npm pack` tarball and the matching CHANGELOG section as its notes.
#
# Publishing to npm is NOT set up: this workflow never runs `npm publish` and
# needs no `NPM_TOKEN` secret. Publishing the package to a registry is an
# owner decision for later; see CONTRIBUTING "Releasing".
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Draft release with packed tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Pinned by version tag; SHA pinning is pending (see TDD section 2, CI row).
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack smoke test
        run: npm run pack:smoke

      - name: Test release-notes extractor
        run: node --test scripts/release-notes.test.mjs

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          pkg_version="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          if [ "${GITHUB_REF_NAME}" != "v${pkg_version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version} (expected v${pkg_version})" >&2
            exit 1
          fi

      - name: Pack tarball
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent | tail -n 1)"
          echo "TARBALL=${tarball}" >> "${GITHUB_ENV}"

      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pkg_version="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          node scripts/release-notes.mjs "${pkg_version}" > "${RUNNER_TEMP}/release-notes.md"
          gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" "${TARBALL}"

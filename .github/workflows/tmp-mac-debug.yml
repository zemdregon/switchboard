name: tmp-mac-debug
on:
  pull_request:
permissions:
  contents: read
jobs:
  dbg:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: |
          echo "--- ps head"
          env -i LC_ALL=C TZ=UTC /bin/ps -A -o pid= -o ppid= -o pgid= -o state= -o lstart= | head -8
          echo "--- ps exit"
          env -i LC_ALL=C TZ=UTC /bin/ps -A -o pid= -o ppid= -o pgid= -o state= -o lstart= >/dev/null; echo "exit=$?"
          echo "--- odd rows"
          env -i LC_ALL=C TZ=UTC /bin/ps -A -o pid= -o ppid= -o pgid= -o state= -o lstart= | grep -vE '^ *[0-9]+ +[0-9]+ +[0-9]+ +[A-Za-z+<>]+ +[A-Z][a-z]{2} +[A-Z][a-z]{2} +[0-9]{1,2} +[0-9]{2}:[0-9]{2}:[0-9]{2} +[0-9]{4}$' | head
          echo "--- tmpdir"; node -e 'console.log(require("os").tmpdir(), process.env.TMPDIR)'
      - run: |
          cat > $RUNNER_TEMP/t.mjs <<'EOF'
          import { spawn } from "node:child_process";
          import { execFileSync } from "node:child_process";
          const p = spawn(process.execPath, ["-e", "setInterval(()=>{},1000)"], { detached: true, stdio: "ignore" });
          await new Promise(r => setTimeout(r, 500));
          const show = () => console.log(execFileSync("/bin/ps", ["-A","-o","pid=","-o","pgid=","-o","state=","-o","command="], {encoding:"utf8"}).split("\n").filter(l => l.includes(String(p.pid))).join("\n"));
          show();
          process.kill(-p.pid, "SIGTERM");
          await new Promise(r => setTimeout(r, 300));
          console.log("after SIGTERM"); show();
          p.on("exit", () => {});
          await new Promise(r => setTimeout(r, 300));
          console.log("after wait"); show();
          EOF
          node $RUNNER_TEMP/t.mjs

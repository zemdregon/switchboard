name: tmp-mac-debug
on:
  pull_request:
permissions:
  contents: read
jobs:
  dbg:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: |
          echo "--- ps head"
          env -i LC_ALL=C TZ=UTC /bin/ps -A -o pid= -o ppid= -o pgid= -o state= -o lstart= | head -8
          echo "--- ps exit"
          env -i LC_ALL=C TZ=UTC /bin/ps -A -o pid= -o ppid= -o pgid= -o state= -o lstart= >/dev/null; echo "exit=$?"
          echo "--- odd rows"
          env -i LC_ALL=C TZ=UTC /bin/ps -A -o pid= -o ppid= -o pgid= -o state= -o lstart= | grep -vE '^ *[0-9]+ +[0-9]+ +[0-9]+ +[A-Za-z+<>]+ +[A-Z][a-z]{2} +[A-Z][a-z]{2} +[0-9]{1,2} +[0-9]{2}:[0-9]{2}:[0-9]{2} +[0-9]{4}$' | head
          echo "--- tmpdir"; node -e 'console.log(require("os").tmpdir(), process.env.TMPDIR)'
      - run: |
          cat > $RUNNER_TEMP/t.mjs <<'EOF'
          import { spawn, execFileSync } from "node:child_process";
          const ps = () => { const t0 = Date.now(); const o = execFileSync("/bin/ps", ["-A","-o","pid=","-o","pgid=","-o","state="], {encoding:"utf8"}); return [Date.now()-t0, o]; };
          const probe = (pgid) => { try { process.kill(-pgid, 0); return "ok"; } catch (e) { return e.code; } };
          // child with a grandchild, both in one group; leader will be left unreaped for a while by blocking the event loop
          const p = spawn(process.execPath, ["-e", "require('child_process').spawn(process.execPath,['-e','setInterval(()=>{},1000)'],{stdio:'ignore'}); setInterval(()=>{},1000)"], { detached: true, stdio: "ignore" });
          await new Promise(r => setTimeout(r, 700));
          const [ms0] = ps(); console.log("ps ms", ms0);
          process.kill(-p.pid, "SIGKILL");
          const end = Date.now() + 60; while (Date.now() < end) {} // block: no reaping by node
          const [ms1, o] = ps();
          console.log("kill(-pgid,0) while leader unreaped:", probe(p.pid), "ps ms", ms1);
          console.log(o.split("\n").filter(l => l.trim().split(/ +/)[1] == String(p.pid)).join("\n"));
          await new Promise(r => setTimeout(r, 300));
          console.log("after reap:", probe(p.pid));
          EOF
          node $RUNNER_TEMP/t.mjs
